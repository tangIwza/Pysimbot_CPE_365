<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2110" viewBox="0 0 1200 2110" role="img" aria-labelledby="title desc">
  <title id="title">RC 2 Robot Control Algorithm</title>
  <desc id="desc">A decision flowchart for the RC 2 PySimbot controller. It prioritizes recovery, front avoidance, critical side avoidance, open-space food tracking, and corridor food tracking.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #17365d; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .node-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #172554; }
      .node-text { font: 400 18px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .diamond-text { font: 700 20px Arial, Helvetica, sans-serif; fill: #172554; text-anchor: middle; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #334155; }
      .connector { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .return-line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { stroke: #334155; stroke-width: 3; rx: 20; }
      .diamond { stroke: #334155; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="2110" fill="#ffffff"/>
  <text x="600" y="58" class="title" text-anchor="middle">RC 2 Robot Control Algorithm</text>
  <text x="600" y="88" class="subtitle" text-anchor="middle">Rule-based collision avoidance and food tracking</text>

  <rect x="295" y="120" width="610" height="78" class="box" fill="#e0f2fe"/>
  <text x="600" y="153" class="node-title" text-anchor="middle">Start update()</text>
  <text x="600" y="180" class="node-text" text-anchor="middle">Read IR0, IR1, IR7, smell(), and stuck state</text>

  <path d="M600 198 L600 244" class="connector"/>
  <path d="M600 244 L810 320 L600 396 L390 320 Z" class="diamond" fill="#fee2e2"/>
  <text x="600" y="313" class="diamond-text">Stuck or IR0 ≤ 0?</text>
  <text x="600" y="338" class="diamond-text">Recovery required</text>

  <path d="M810 320 L860 320" class="connector"/>
  <text x="824" y="303" class="label">Yes</text>
  <rect x="865" y="230" width="295" height="188" class="box" fill="#fee2e2"/>
  <text x="885" y="267" class="node-title">Recovery</text>
  <text x="885" y="299" class="node-text">Choose or keep safe direction</text>
  <text x="885" y="326" class="node-text">After 2 failed reverses: flip</text>
  <text x="885" y="365" class="node-text">turn(±30°), move(-2)</text>

  <path d="M600 396 L600 492" class="connector"/>
  <text x="616" y="454" class="label">No</text>
  <path d="M600 492 L810 568 L600 644 L390 568 Z" class="diamond" fill="#ffedd5"/>
  <text x="600" y="575" class="diamond-text">IR0 ≤ 30?</text>

  <path d="M810 568 L860 568" class="connector"/>
  <text x="824" y="551" class="label">Yes</text>
  <rect x="865" y="478" width="295" height="180" class="box" fill="#ffedd5"/>
  <text x="885" y="515" class="node-title">Front avoidance</text>
  <text x="885" y="547" class="node-text">Choose wider side</text>
  <text x="885" y="574" class="node-text">Tie-break with food direction</text>
  <text x="885" y="613" class="node-text">Lock direction, turn(±18°)</text>

  <path d="M600 644 L600 740" class="connector"/>
  <text x="616" y="702" class="label">No</text>
  <path d="M600 740 L810 816 L600 892 L390 816 Z" class="diamond" fill="#fef9c3"/>
  <text x="600" y="809" class="diamond-text">IR1 &lt; 5 or IR7 &lt; 5?</text>
  <text x="600" y="834" class="diamond-text">Critical side danger</text>

  <path d="M810 816 L860 816" class="connector"/>
  <text x="824" y="799" class="label">Yes</text>
  <rect x="865" y="724" width="295" height="190" class="box" fill="#fef9c3"/>
  <text x="885" y="761" class="node-title">Critical side avoidance</text>
  <text x="885" y="793" class="node-text">Lock turn away from close side</text>
  <text x="885" y="820" class="node-text">turn(±8°) only</text>
  <text x="885" y="859" class="node-text">Do not move until clear</text>

  <path d="M600 892 L600 988" class="connector"/>
  <text x="616" y="950" class="label">No</text>
  <path d="M600 988 L810 1064 L600 1140 L390 1064 Z" class="diamond" fill="#dcfce7"/>
  <text x="600" y="1057" class="diamond-text">IR1 &gt; 30 and IR7 &gt; 30?</text>
  <text x="600" y="1082" class="diamond-text">Both sides open</text>

  <path d="M810 1064 L860 1064" class="connector"/>
  <text x="824" y="1047" class="label">Yes</text>
  <rect x="865" y="972" width="295" height="186" class="box" fill="#dcfce7"/>
  <text x="885" y="1009" class="node-title">Open-space food tracking</text>
  <text x="885" y="1041" class="node-text">Clamp smell() to ±8°</text>
  <text x="885" y="1080" class="node-text">turn(), move(+5)</text>

  <path d="M600 1140 L600 1250" class="connector"/>
  <text x="616" y="1203" class="label">No</text>
  <rect x="250" y="1250" width="700" height="196" class="box" fill="#dbeafe"/>
  <text x="600" y="1291" class="node-title" text-anchor="middle">Corridor food tracking</text>
  <text x="600" y="1327" class="node-text" text-anchor="middle">Front is clear; neither side is critical; at least one side is within 30 units</text>
  <text x="600" y="1361" class="node-text" text-anchor="middle">If food turn points to tighter side: correct toward open side by at most 4°</text>
  <text x="600" y="1400" class="node-text" text-anchor="middle">Otherwise keep the food turn; then move(+5)</text>

  <path d="M1012 418 L1012 1695 L850 1695" class="return-line"/>
  <path d="M1012 658 L1012 1695" class="return-line"/>
  <path d="M1012 914 L1012 1695" class="return-line"/>
  <path d="M1012 1158 L1012 1695" class="return-line"/>
  <path d="M600 1446 L600 1695" class="connector"/>

  <rect x="350" y="1695" width="500" height="92" class="box" fill="#e2e8f0"/>
  <text x="600" y="1733" class="node-title" text-anchor="middle">Next update() frame</text>
  <text x="600" y="1760" class="node-text" text-anchor="middle">Read the sensors again and repeat the priority order</text>

  <text x="600" y="1880" class="subtitle" text-anchor="middle">Sensor roles: IR0 = front, IR1 = front-right, IR7 = front-left</text>
  <text x="600" y="1911" class="subtitle" text-anchor="middle">The first matching condition acts and returns for that frame.</text>
</svg>
